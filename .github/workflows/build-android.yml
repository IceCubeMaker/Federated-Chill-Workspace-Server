name: Build Android APK

on:
  workflow_dispatch:        # manual trigger — click "Run workflow" on GitHub
  push:                     # auto-build on every push to any branch
    paths:
      - 'packages/app-web/**'
      - 'packages/app/**'
      - 'packages/auth/**'
      - 'packages/groups/**'
      - 'packages/permissions/**'
      - 'packages/models/**'
      - 'packages/network/**'
      - 'packages/store/**'
      - 'packages/sync/**'
      - 'packages/ui/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write           # needed to create/update GitHub Releases

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all library packages
        run: pnpm --filter '@federation/*' --filter '!@federation/app-web' --filter '!@federation/app-desktop' build

      - name: Build web app
        run: pnpm --filter @federation/app-web build

      - name: Sync Capacitor (copy built web assets into Android project)
        working-directory: packages/app-web
        run: ./node_modules/.bin/cap sync android --no-build

      - name: Make Gradlew executable
        working-directory: packages/app-web/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: packages/app-web/android
        run: ./gradlew assembleDebug

      - name: Build release APK (unsigned, for sideloading)
        working-directory: packages/app-web/android
        run: ./gradlew assembleRelease

      - name: Rename APKs with commit SHA
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cp packages/app-web/android/app/build/outputs/apk/debug/app-debug.apk \
             federated-workspace-debug-${SHORT_SHA}.apk
          cp packages/app-web/android/app/build/outputs/apk/release/app-release-unsigned.apk \
             federated-workspace-release-${SHORT_SHA}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          body: |
            Automated build from commit ${{ github.sha }} on branch `${{ github.ref_name }}`.

            **debug APK** — install directly for testing (allows USB debugging)
            **release APK** — unsigned; enable "Install unknown apps" to sideload
          prerelease: true
          make_latest: true
          files: |
            federated-workspace-debug-*.apk
            federated-workspace-release-*.apk
