name: Build Android APK

on:
  workflow_dispatch:        # manual trigger — click "Run workflow" on GitHub
  push:
    branches: [main, master]
    paths:
      - 'packages/app-web/**'
      - 'packages/app/**'
      - 'packages/auth/**'
      - 'packages/models/**'
      - 'packages/ui/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all library packages
        run: pnpm --filter '@federation/*' --filter '!@federation/app-web' --filter '!@federation/app-desktop' build

      - name: Build web app
        run: pnpm --filter @federation/app-web build

      - name: Sync Capacitor (copy built web assets into Android project)
        working-directory: packages/app-web
        run: ./node_modules/.bin/cap sync android --no-build

      - name: Make Gradlew executable
        working-directory: packages/app-web/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: packages/app-web/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: federated-workspace-debug.apk
          path: packages/app-web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Optional: also build a release APK (unsigned, for sideloading)
      - name: Build release APK (unsigned)
        working-directory: packages/app-web/android
        run: ./gradlew assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: federated-workspace-release-unsigned.apk
          path: packages/app-web/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
